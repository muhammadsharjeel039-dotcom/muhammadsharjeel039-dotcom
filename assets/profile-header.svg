<svg xmlns="http://www.w3.org/2000/svg" width="960" height="312" viewBox="0 0 960 312" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Sharjeel Abid | Frontend Developer</title>
  <desc id="desc">Charcoal and orange portfolio banner featuring a terminal-style illustration and a React, JavaScript, and CSS stack.</desc>
  <defs>
    <radialGradient id="glow" cx="88%" cy="18%" r="77%">
      <stop stop-color="#F28C26" stop-opacity=".19"/>
      <stop offset=".8" stop-color="#F28C26" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x2="1" y2="1">
      <stop stop-color="#F28C26" stop-opacity=".65"/>
      <stop offset=".65" stop-color="#404040"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0v28" fill="none" stroke="#F28C26" stroke-opacity=".12"/>
    </pattern>
    <clipPath id="canvas"><rect width="960" height="312" rx="22"/></clipPath>
    <style>
      .cursor { animation: blink 1.35s step-end infinite; }
      @keyframes blink { 50% { opacity: .2; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#canvas)">
    <rect width="960" height="312" fill="#121212"/>
    <rect width="960" height="312" fill="url(#glow)"/>
    <path d="M552 0H960V312H592L790 114Z" fill="url(#grid)"/>
    <path d="M0 285H960" stroke="#404040"/>
    <path d="M0 285h470" stroke="#F28C26" stroke-opacity=".63"/>
    <rect x="48" y="57" width="9" height="9" rx="2" fill="#F28C26"/>
    <text x="70" y="67" fill="#F28C26" font-family="Consolas, monospace" font-size="16" font-weight="700" letter-spacing="2.4">FRONTEND DEVELOPER</text>
    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="750" font-size="62" letter-spacing="-2.6">
      <text x="45" y="141" fill="#F5F5F5">Muhammad</text>
      <text x="45" y="204" fill="#F28C26">Sharjeel Abid</text>
    </g>
    <text x="49" y="247" fill="#B0B0B0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21">React · JavaScript · Responsive UI</text>

    <rect x="573" y="77" width="327" height="171" rx="16" fill="#121212" stroke="#F28C26" stroke-opacity=".32"/>
    <rect x="551" y="56" width="329" height="172" rx="15" fill="#1E1E1E" stroke="#F28C26" stroke-opacity=".68"/>
    <path d="M552 98h327" stroke="#404040"/>
    <circle cx="572" cy="77" r="4" fill="#F28C26"/>
    <circle cx="588" cy="77" r="4" fill="#D97706" opacity=".75"/>
    <circle cx="604" cy="77" r="4" fill="#404040"/>
    <text x="627" y="82" fill="#B0B0B0" font-family="Consolas, monospace" font-size="15">Profile.jsx</text>
    <g font-family="Consolas, monospace" font-size="20">
      <text x="576" y="134" fill="#F28C26">&lt;FrontendDeveloper</text>
      <text x="594" y="170" fill="#F5F5F5">focus=<tspan fill="#FFBF77">"Responsive UI"</tspan></text>
      <text x="576" y="204" fill="#F28C26">/&gt;</text>
    </g>
    <rect class="cursor" x="607" y="188" width="9" height="17" rx="1" fill="#F28C26"/>
  </g>
  <rect x=".5" y=".5" width="959" height="311" rx="21.5" fill="none" stroke="url(#edge)"/>
